# Lovable → NADF → agents → visual parity → auto-merge → deploy DEV (nunca PROD)
#
# Trigger: repository_dispatch desde novus-nexus (event lovable-commit) o manual.
# Secrets: CURSOR_API_KEY, GH_PAT
# Vars opcionales: NADF_LOVABLE_REFERENCE_URL, NADF_DEV_FRONTEND_URL
name: Lovable sync DEV

on:
  repository_dispatch:
    types: [lovable-commit, nadf-lovable-sync]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pipeline agents; deploy-only = solo deploy DEV; parity-only = checker visual"
        required: true
        default: full
        type: choice
        options: [full, deploy-only, parity-only]
      auto_merge:
        description: "Merge PRs productivos tras gates PASS"
        required: true
        default: true
        type: boolean
      auto_deploy_dev:
        description: "Disparar Deploy DEV WEB/Back"
        required: true
        default: true
        type: boolean

concurrency:
  group: lovable-sync-dev
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/m6-cloud-agent/package-lock.json
      - name: Install M6 prototype
        working-directory: prototypes/m6-cloud-agent
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: prototypes/m6-cloud-agent
        run: npx playwright install --with-deps chromium
      - name: Run full lovable-to-web pipeline
        working-directory: prototypes/m6-cloud-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NADF_AUTO_MERGE_DEV: ${{ github.event.inputs.auto_merge || 'true' }}
          NADF_AUTO_DEPLOY_DEV: ${{ github.event.inputs.auto_deploy_dev || 'true' }}
          NADF_REQUIRE_VISUAL_PARITY: "true"
          NADF_AUTO_CREATE_PR: "true"
          NADF_PROJECT_ID: novus-intelligence
          NADF_LOVABLE_REFERENCE_URL: ${{ vars.NADF_LOVABLE_REFERENCE_URL }}
          NADF_DEV_FRONTEND_URL: ${{ vars.NADF_DEV_FRONTEND_URL || 'https://d1bfu6klutpp8m.cloudfront.net' }}
          NADF_VISUAL_PARITY_MAX_DIFF_RATIO: "0.002"
        run: |
          npm run invoke:lovable-analyzer
          npm run invoke:planner
          npm run invoke:backend-impact
          npm run invoke:architect
          npm run invoke:remaining-pipeline
          if [ -n "$NADF_LOVABLE_REFERENCE_URL" ]; then
            npm run visual-parity-check
          else
            echo "WARN: sin NADF_LOVABLE_REFERENCE_URL — visual-parity via Cloud Agent ya en pipeline"
          fi
          npm run post-pipeline-dev

  parity_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'parity-only' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/m6-cloud-agent/package-lock.json
      - working-directory: prototypes/m6-cloud-agent
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run visual-parity-check
        env:
          NADF_LOVABLE_REFERENCE_URL: ${{ vars.NADF_LOVABLE_REFERENCE_URL }}
          NADF_DEV_FRONTEND_URL: ${{ vars.NADF_DEV_FRONTEND_URL || 'https://d1bfu6klutpp8m.cloudfront.net' }}
          NADF_VISUAL_PARITY_MAX_DIFF_RATIO: "0.002"

  deploy_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy DEV (WEB + Back)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceBack
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceWEB
