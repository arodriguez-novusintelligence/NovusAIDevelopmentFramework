# Lovable → NADF → agents → post-pipeline
#
# Modes:
#   smoke  = prueba de cableado (agentes mínimos + post smoke). NO merge/deploy. Arquetipo intacto.
#   full   = pipeline completo + gates desde artifacts frescos (PRs Cloud). Protect archetype by default.
#   deploy-only / parity-only = utilidades
#
# Secrets: CURSOR_API_KEY, GH_PAT
name: Lovable sync DEV

on:
  repository_dispatch:
    types: [lovable-commit, nadf-lovable-sync]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = cableado; full = pipeline+gates; deploy-only; parity-only"
        required: true
        default: smoke
        type: choice
        options: [smoke, full, deploy-only, parity-only]
      auto_merge:
        description: "Merge PRs productivos (ignorado si protect archetype / smoke)"
        required: true
        default: false
        type: boolean
      auto_deploy_dev:
        description: "Deploy DEV (ignorado si protect archetype / smoke)"
        required: true
        default: false
        type: boolean

concurrency:
  group: lovable-sync-dev
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ github.event_name == 'repository_dispatch' || inputs.mode == 'full' || inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/m6-cloud-agent/package-lock.json
      - name: Install M6 prototype
        working-directory: prototypes/m6-cloud-agent
        run: npm ci
      - name: Install Playwright Chromium
        if: ${{ github.event_name == 'repository_dispatch' || inputs.mode == 'full' }}
        working-directory: prototypes/m6-cloud-agent
        run: npx playwright install --with-deps chromium
      - name: Resolve run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Push Lovable: por defecto smoke para no tocar arquetipo hasta instancia
            MODE="${{ vars.NADF_DISPATCH_MODE || 'smoke' }}"
          else
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved MODE=$MODE"
      - name: Smoke — analyzer + post (arquetipo intacto)
        if: ${{ steps.mode.outputs.mode == 'smoke' }}
        working-directory: prototypes/m6-cloud-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NADF_SMOKE_TEST: "true"
          NADF_PROTECT_ARCHETYPE: "true"
          NADF_AUTO_MERGE_DEV: "false"
          NADF_AUTO_DEPLOY_DEV: "false"
          NADF_REQUIRE_VISUAL_PARITY: "false"
          NADF_AUTO_CREATE_PR: "true"
          NADF_PROJECT_ID: novus-intelligence
          NADF_MODEL: ${{ vars.NADF_MODEL || 'composer-2.5' }}
          NADF_REPO_FRAMEWORK: ${{ vars.NADF_REPO_FRAMEWORK || 'https://github.com/arodriguez-novusintelligence/NovusAIDevelopmentFramework.git' }}
          NADF_REPO_LOVABLE: ${{ vars.NADF_REPO_LOVABLE || 'https://github.com/arodriguez-novusintelligence/novus-nexus.git' }}
          NADF_REF_FRAMEWORK: ${{ vars.NADF_REF_FRAMEWORK || 'feature/nadf-foundation' }}
          NADF_REF_LOVABLE: ${{ vars.NADF_REF_LOVABLE || 'main' }}
          NADF_TARGET_ENV: dev
          NADF_TARGET_REGION: sa-east-1
        run: |
          npm run invoke:lovable-analyzer
          npm run post-pipeline-dev
      - name: Full lovable-to-web pipeline
        if: ${{ steps.mode.outputs.mode == 'full' }}
        working-directory: prototypes/m6-cloud-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NADF_SMOKE_TEST: "false"
          NADF_PROTECT_ARCHETYPE: ${{ vars.NADF_PROTECT_ARCHETYPE || 'true' }}
          NADF_AUTO_MERGE_DEV: ${{ github.event.inputs.auto_merge || 'false' }}
          NADF_AUTO_DEPLOY_DEV: ${{ github.event.inputs.auto_deploy_dev || 'false' }}
          NADF_REQUIRE_VISUAL_PARITY: ${{ vars.NADF_LOVABLE_REFERENCE_URL != '' }}
          NADF_ARTIFACTS_REMOTE_ONLY: "true"
          NADF_AUTO_CREATE_PR: "true"
          NADF_PROJECT_ID: novus-intelligence
          NADF_MODEL: ${{ vars.NADF_MODEL || 'composer-2.5' }}
          NADF_REPO_FRAMEWORK: ${{ vars.NADF_REPO_FRAMEWORK || 'https://github.com/arodriguez-novusintelligence/NovusAIDevelopmentFramework.git' }}
          NADF_REPO_LOVABLE: ${{ vars.NADF_REPO_LOVABLE || 'https://github.com/arodriguez-novusintelligence/novus-nexus.git' }}
          NADF_REPO_FRONTEND: ${{ vars.NADF_REPO_FRONTEND || 'https://github.com/arodriguez-novusintelligence/NovusIntelligenceWEB.git' }}
          NADF_REPO_BACKEND: ${{ vars.NADF_REPO_BACKEND || 'https://github.com/arodriguez-novusintelligence/NovusIntelligenceBack.git' }}
          NADF_REF_FRAMEWORK: ${{ vars.NADF_REF_FRAMEWORK || 'feature/nadf-foundation' }}
          NADF_REF_LOVABLE: ${{ vars.NADF_REF_LOVABLE || 'main' }}
          NADF_TARGET_ENV: dev
          NADF_TARGET_REGION: sa-east-1
          NADF_LOVABLE_REFERENCE_URL: ${{ vars.NADF_LOVABLE_REFERENCE_URL }}
          NADF_DEV_FRONTEND_URL: ${{ vars.NADF_DEV_FRONTEND_URL || 'https://d1bfu6klutpp8m.cloudfront.net' }}
          NADF_VISUAL_PARITY_MAX_DIFF_RATIO: "0.002"
        run: |
          npm run invoke:lovable-analyzer
          npm run invoke:planner
          npm run invoke:backend-impact
          npm run invoke:architect
          npm run invoke:remaining-pipeline
          if [ -n "$NADF_LOVABLE_REFERENCE_URL" ]; then
            npm run visual-parity-check
          else
            echo "WARN: sin NADF_LOVABLE_REFERENCE_URL — checker de píxeles omitido"
          fi
          npm run post-pipeline-dev

  parity_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'parity-only' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/m6-cloud-agent/package-lock.json
      - working-directory: prototypes/m6-cloud-agent
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run visual-parity-check
        env:
          NADF_LOVABLE_REFERENCE_URL: ${{ vars.NADF_LOVABLE_REFERENCE_URL }}
          NADF_DEV_FRONTEND_URL: ${{ vars.NADF_DEV_FRONTEND_URL || 'https://d1bfu6klutpp8m.cloudfront.net' }}
          NADF_VISUAL_PARITY_MAX_DIFF_RATIO: "0.002"

  deploy_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy DEV (WEB + Back)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceBack
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceWEB
