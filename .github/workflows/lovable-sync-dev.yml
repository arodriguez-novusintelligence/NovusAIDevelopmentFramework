# Lovable → NADF → (agents) → auto-merge gated PRs → deploy DEV
#
# Trigger: push to novus-nexus main (via repository_dispatch) or manual.
# Runs M6 cloud-agent pipeline, then requests merges/deploys.
#
# Secrets: CURSOR_API_KEY, GH_PAT (repo + workflow), AWS_* (optional if dispatching deploy only)
name: Lovable sync DEV

on:
  repository_dispatch:
    types: [lovable-commit, nadf-lovable-sync]
  workflow_dispatch:
    inputs:
      mode:
        description: "full = pipeline agents; deploy-only = skip agents"
        required: true
        default: full
        type: choice
        options: [full, deploy-only]
      auto_merge:
        description: "Merge agent PRs to main after QA/Security PASS"
        required: true
        default: true
        type: boolean
      auto_deploy_dev:
        description: "Trigger WEB/Back Deploy DEV workflows after merge"
        required: true
        default: true
        type: boolean

concurrency:
  group: lovable-sync-dev
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/m6-cloud-agent/package-lock.json
      - name: Install M6 prototype
        working-directory: prototypes/m6-cloud-agent
        run: npm ci
      - name: Run full lovable-to-web pipeline (Cloud Agents)
        working-directory: prototypes/m6-cloud-agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NADF_AUTO_MERGE_DEV: ${{ github.event.inputs.auto_merge || 'true' }}
          NADF_AUTO_DEPLOY_DEV: ${{ github.event.inputs.auto_deploy_dev || 'true' }}
          NADF_PROJECT: novus-intelligence
        run: |
          npm run invoke:lovable-analyzer
          npm run invoke:planner
          npm run invoke:backend-impact
          npm run invoke:architect
          npm run invoke:remaining-pipeline
          npm run post-pipeline-dev

  deploy_only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Back Deploy DEV
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceBack
          gh workflow run "Deploy DEV" --repo arodriguez-novusintelligence/NovusIntelligenceWEB
