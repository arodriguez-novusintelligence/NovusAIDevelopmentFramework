environment: dev
provider: aws
region: sa-east-1
status: target_environment

frontend:
  hosting:
    service: object_storage
    provider: aws
    bucket_name: novus-intelligence-web-dev-519010577666
    cdn_enabled: true
    cloudfront_distribution_id: E8IN00J3MFCNO
  url: https://d1bfu6klutpp8m.cloudfront.net
  url_dns_pending: https://dev.novusintelligence.com
  build_command: npm run build
  lint_command: npm run lint

backend:
  service: serverless_api
  provider: aws
  stack_name: novus-intelligence-back-dev
  api_url: https://api-dev.novusintelligence.com
  runtime: nodejs20.x
  region: sa-east-1

services:
  storage:
    provider: aws
    service: object_storage
    bucket_name: novus-intelligence-assets-dev
    region: sa-east-1
  email:
    provider: aws
    service: email
    from_address: noreply-dev@novusintelligence.com
  database:
    provider: aws
    service: nosql_database
    table_prefix: novus-intelligence-dev
    region: sa-east-1

env_variables:
  - name: NODE_ENV
    description: Entorno de ejecución (development)
  - name: API_BASE_URL
    description: URL base de la API backend
  - name: CONTACT_EMAIL_TO
    description: Email destino del formulario de contacto
  - name: AWS_REGION
    description: Región AWS del entorno DEV (sa-east-1)

deploy:
  requires_human_approval: false
  auto_after_gates: true
  gates_required:
    - plan_approved
    - qa_pass
    - security_pass
    - visual_exact_parity
  engine: github-actions
  workflows:
    - NovusIntelligenceWEB/.github/workflows/deploy-dev.yml
    - NovusIntelligenceBack/.github/workflows/deploy-dev.yml
  nadf_cloud_agent_role: cloud-agent
  notes:
    - Deploy automático SOLO a DEV tras gates (incl. paridad visual exacta)
    - PROD y QA siguen con aprobación humana (ADR-0006)
    - Cloud Agent no despliega a prod autónomo

notes:
  - Región oficial de desarrollo: sa-east-1 (São Paulo)
  - URL CloudFront activa: https://d1bfu6klutpp8m.cloudfront.net
  - No incluir valores reales de variables de entorno ni secretos
  - Este archivo es un template de configuración
