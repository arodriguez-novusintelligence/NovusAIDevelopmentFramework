environment: prod
provider: aws
region: us-east-1

frontend:
  hosting:
    service: object_storage
    provider: aws
    bucket_name: novus-intelligence-web-prod
    cdn_enabled: true
  url: https://www.novusintelligence.com
  build_command: npm run build
  lint_command: npm run lint

backend:
  service: serverless_api
  provider: aws
  stack_name: novus-intelligence-back-prod
  api_url: https://api.novusintelligence.com
  runtime: nodejs20.x

services:
  storage:
    provider: aws
    service: object_storage
    bucket_name: novus-intelligence-assets-prod
  email:
    provider: aws
    service: email
    from_address: noreply@novusintelligence.com
  database:
    provider: aws
    service: nosql_database
    table_prefix: novus-intelligence-prod

env_variables:
  - name: NODE_ENV
    description: Entorno de ejecución
  - name: API_BASE_URL
    description: URL base de la API backend
  - name: CONTACT_EMAIL_TO
    description: Email destino del formulario de contacto

notes:
  - No incluir valores reales de variables de entorno
  - Despliegue a producción requiere aprobación humana explícita
  - Verificar todos los quality gates antes de desplegar
