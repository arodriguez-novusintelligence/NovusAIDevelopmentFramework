# NADF-GUIDE
# Propósito: Define qa como configuración declarativa NADF.
# Configuración: Configurar ID, scope, adapters, entornos, budget y gates propios del proyecto.
environment: qa
provider: aws
region: us-east-1

frontend:
  hosting:
    service: object_storage
    provider: aws
    bucket_name: novus-intelligence-web-qa
    cdn_enabled: true
  url: https://qa.novusintelligence.com
  build_command: npm run build
  lint_command: npm run lint

backend:
  service: serverless_api
  provider: aws
  stack_name: novus-intelligence-back-qa
  api_url: https://api-qa.novusintelligence.com
  runtime: nodejs20.x

services:
  storage:
    provider: aws
    service: object_storage
    bucket_name: novus-intelligence-assets-qa
  email:
    provider: aws
    service: email
    from_address: noreply-qa@novusintelligence.com
  database:
    provider: aws
    service: nosql_database
    table_prefix: novus-intelligence-qa

env_variables:
  - name: NODE_ENV
    description: Entorno de ejecución
  - name: API_BASE_URL
    description: URL base de la API backend
  - name: CONTACT_EMAIL_TO
    description: Email destino del formulario de contacto

notes:
  - No incluir valores reales de variables de entorno
  - Despliegue a QA requiere aprobación humana explícita
