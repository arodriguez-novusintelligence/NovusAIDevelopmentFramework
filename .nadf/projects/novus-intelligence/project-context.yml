# NADF-GUIDE
# Propósito: Define project context como configuración declarativa NADF.
# Configuración: Configurar ID, scope, adapters, entornos, budget y gates propios del proyecto.
application:
  name: Novus Intelligence Solutions
  type: corporate_website
  domain: artificial_intelligence_services
  description: Sitio web corporativo de Novus Intelligence para servicios de inteligencia artificial
  version: "0.2.0"
  status: multiagent_setup

architecture:
  model: multiagent
  adr: ADR-0002-multiagent-patterns
  layers:
    - design_source
    - planning
    - execution
    - validation
    - knowledge
    - tooling
    - runtime
  patterns:
    - Planner
    - Executor
    - Validator
    - Mediator
    - Blackboard
    - Event Driven
    - Reflection

repositories:
  framework: NovusAIDevelopmentFramework
  lovable_source: novus-nexus
  frontend: NovusIntelligenceWEB
  backend: NovusIntelligenceBack
  urls:
    framework: https://github.com/arodriguez-novusintelligence/NovusAIDevelopmentFramework.git
    lovable_source: https://github.com/arodriguez-novusintelligence/novus-nexus.git
    frontend: https://github.com/arodriguez-novusintelligence/NovusIntelligenceWEB.git
    backend: https://github.com/arodriguez-novusintelligence/NovusIntelligenceBack.git

frontend:
  repo: NovusIntelligenceWEB
  framework: React
  language: TypeScript
  styling: Tailwind
  routing: React Router
  build_tool: Vite
  package_manager: npm

backend:
  repo: NovusIntelligenceBack
  framework: Serverless Framework
  runtime: Node.js 20
  language: TypeScript
  cloud: AWS
  region: sa-east-1
  package_manager: npm

design_source:
  tool: Lovable
  repo: novus-nexus
  url: https://github.com/arodriguez-novusintelligence/novus-nexus.git
  role: visual_and_functional_intent_only
  event_trigger: lovable.commit
  forbidden:
    - copy_lovable_code_directly
    - use_mock_data_in_production

runtime_bridge:
  primary_engine: cursor-cloud
  adapter: cursor-cloud
  adr: ADR-0005-agent-runtime-bridge
  prototype: prototypes/m6-cloud-agent/
  guide: docs/cloud-agent-integration.md
  first_runbook: docs/runbooks/novus-intelligence-first-run.md

environments:
  default: dev
  path: .nadf/projects/novus-intelligence/environments/
  dev:
    region: sa-east-1
    deploy_requires_approval: false
    auto_deploy_after_gates: true
    frontend_url: https://d1bfu6klutpp8m.cloudfront.net

multiagent:
  orchestrator: mvp-github-actions
  orchestrator_mode: event_driven_mvp
  execution_engine: cursor-cloud
  primary_workflow: lovable-to-web
  canonical_workflow: .nadf/global/workflow-library/lovable-to-web.yml
  workflow_steps: 19
  workflow_phases: 9
  automation:
    trigger: lovable.commit
    github_workflow: .github/workflows/lovable-sync-dev.yml
    notify_template: Documentacion/templates/novus-nexus-notify-nadf.yml
    auto_merge_dev: true
    auto_deploy_dev: true
    auto_deploy_prod: false
    default_profile: visual-fast
    routing:
      visual_fast_when:
        allowed_change_types: [visual, content]
        backend_required: false
        examples: [colors, typography, title, copy, spacing, styles]
      fallback: full
    profiles:
      visual-fast:
        agents:
          - lovable-analyzer-agent
          - frontend-integration-agent
          - qa-agent
        skipped_domains: [backend, database, cloud, infrastructure]
        deploy_targets: [NovusIntelligenceWEB]
        expected_duration: short
      full:
        agents: all_applicable
        deploy_targets: [NovusIntelligenceWEB, NovusIntelligenceBack]
  agents_enabled:
    - framework-architect-agent
    - lovable-analyzer-agent
    - planner-agent
    - architect-agent
    - workflow-agent
    - backend-impact-agent
    - frontend-integration-agent
    - backend-agent
    - database-agent
    - cloud-agent
    - devops-agent
    - qa-agent
    - visual-parity-agent
    - security-agent
    - reviewer-agent
    - documentation-agent
    - metrics-agent
    - reflection-agent
    - knowledge-base-agent
    - adr-agent
    # Requirement Intake (ADR-0007) — opt-in; used by workflow requirement-intake
    - requirement-intake-agent
    - requirement-normalization-agent
    - requirement-classification-agent
    - requirement-deduplication-agent
    - requirement-validation-agent
    - requirement-approval-agent
    - requirement-traceability-agent
  mcp_servers:
    - github
    - aws

requirement_intake:
  enabled: opt-in
  adr: ADR-0007-requirement-intake-layer
  path: .nadf/projects/novus-intelligence/requirement-sources/
  workflow: .nadf/global/workflow-library/requirement-intake.yml
  notes:
    - Remote sources (Jira/Slack/GitHub) ship disabled; enable after connection test
    - Never auto-executes code from external payloads
    - lovable-to-web keeps working without activating intake sources

initial_scope:
  - landing_page
  - company_profile
  - services_section
  - contact_form
  - call_to_action
  - responsive_design

quality_gates:
  - plan_approved
  - no_lovable_code_copy
  - no_mock_data_in_production
  - build_success
  - responsive_validation
  - seo_basic_validation
  - visual_exact_parity
  - security_pass
  - metrics_registered
  - reflection_generated
  - adr_if_architectural

visual_parity:
  enabled: true
  agent: visual-parity-agent
  gate: visual_exact_parity
  threshold_max_diff_ratio: 0.002
  routes:
    - /
    - /about
    - /services
    - /contact
  viewports:
    - 1440x900
    - 768x1024
    - 390x844
  candidate_url_default: https://d1bfu6klutpp8m.cloudfront.net
  reference_url_env: NADF_LOVABLE_REFERENCE_URL
  adr: ADR-0006-visual-parity-and-auto-dev-deploy

metadata:
  created: "2026-07-04"
  updated: "2026-07-15"
  updated_by: framework-architect-agent
  nadf_version: "1.1.0-rc.1"
  framework_line: "2.x-product"
  metaModel:
    version: "1.1.0"
  requirement_intake_adr: ADR-0007-requirement-intake-layer
  primary_workflow: lovable-to-web
  canonical_workflow: .nadf/global/workflow-library/lovable-to-web.yml
  primary_command: novus-lovable-sync
  adr_workflow_reconciliation: ADR-0003-lovable-to-web-canonicalization
  runtime_bridge: ADR-0005-agent-runtime-bridge
  visual_parity_adr: ADR-0006-visual-parity-and-auto-dev-deploy
  target_dev_region: sa-east-1
