id: novus-intelligence-security
max_attachment_size: 10485760
allowed_file_types:
  - md
  - txt
  - json
  - yaml
  - yml
  - csv
  - pdf
signature_validation: required_when_supported
replay_window: PT5M
payload_size_limit: 1048576
sanitize_html: true
sanitize_markdown: true
redact_pii_in_logs: true
quarantine_untrusted_attachments: true
secrets: credential_reference_only
never_auto_execute: true
rate_limit:
  max_events_per_minute: 60
