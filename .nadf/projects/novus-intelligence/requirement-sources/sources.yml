sources:
  - id: manual-default
    definition: manual
    enabled: true
    project: novus-intelligence
    ingestion_mode: MANUAL
    credential_reference: null
    mapping: mappings/manual.yml
    policy:
      requires_human_approval: true
      allowed_projects:
        - novus-intelligence
      max_attachment_size: 10485760
      allowed_file_types:
        - md
        - txt
        - json
        - yaml
        - csv
        - pdf

  - id: jira-main
    definition: jira
    enabled: false
    project: novus-intelligence
    ingestion_mode: WEBHOOK
    credential_reference: secret://nadf/dev/jira-main
    mapping: mappings/jira.yml
    policy:
      requires_human_approval: true
      allowed_projects:
        - NOVUS
        - novus-intelligence
      auto_approval: false
      rate_limit:
        max_events_per_minute: 30

  - id: slack-ops
    definition: slack
    enabled: false
    project: novus-intelligence
    ingestion_mode: WEBHOOK
    credential_reference: secret://nadf/dev/slack-ops
    mapping: mappings/slack.yml
    policy:
      requires_human_approval: true
      authorization_gates:
        - authorized_command
        - authorized_channel
      allowed_channels:
        - "#requirements"
      allowed_commands:
        - /nadf-req

  - id: github-issues
    definition: github-issue
    enabled: false
    project: novus-intelligence
    ingestion_mode: WEBHOOK
    credential_reference: secret://nadf/dev/github-issues
    mapping: mappings/github-issue.yml
    policy:
      requires_human_approval: true
      allowed_repositories:
        - aRodriguez-novusintelligence/NovusIntelligenceWEB

notes:
  - Opt-in example only. Disabled remote sources do not alter lovable-to-web.
  - No real credentials are stored; only CredentialReference paths.
  - Enable sources after connection test passes.
