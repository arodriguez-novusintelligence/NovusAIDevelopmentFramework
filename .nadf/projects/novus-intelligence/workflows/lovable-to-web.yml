id: novus-intelligence-lovable-to-web
name: Novus Intelligence — Lovable to Web
version: "2.1.0"
description: Workflow de 19 pasos (incluye visual-parity) para sincronizar cambios novus-nexus al stack productivo con paridad visual exacta y deploy automático DEV.
project: novus-intelligence
extends: lovable-to-web
triggers:
  - command:novus-lovable-sync
  - event:lovable.commit

event:
  type: lovable.commit
  source: novus-nexus
  description: Cambio detectado en repositorio novus-nexus

# Hereda model.phases del workflow global; el orden de fases es inmutable.
# Este archivo solo añade mapeo de proyecto, inputs/outputs específicos y reglas locales.

agents:
  - workflow-agent
  - lovable-analyzer-agent
  - planner-agent
  - architect-agent
  - backend-impact-agent
  - frontend-integration-agent
  - backend-agent
  - database-agent
  - cloud-agent
  - qa-agent
  - visual-parity-agent
  - security-agent
  - reviewer-agent
  - documentation-agent
  - metrics-agent
  - reflection-agent
  - knowledge-base-agent
  - adr-agent

steps:
  - id: paso-01-event-trigger
    order: 1
    phase: event_trigger
    agent: workflow-agent
    action: Clasificar evento lovable.commit y preparar plan-workflow
    inputs:
      - event: lovable.commit
      - source: novus-nexus
    outputs:
      - artifacts/evento-clasificado.json
      - artifacts/plan-workflow.md

  - id: paso-02-cargar-contexto
    order: 2
    phase: event_trigger
    agent: null
    action: Leer project-context.yml, reglas y memoria del proyecto
    inputs:
      - .nadf/projects/novus-intelligence/project-context.yml
      - .nadf/projects/novus-intelligence/rules/
      - .nadf/projects/novus-intelligence/memory/
    outputs:
      - contexto-cargado

  - id: paso-03-analizar-lovable
    order: 3
    phase: planning
    agent: lovable-analyzer-agent
    action: Lovable Analyzer Agent analiza cambio en novus-nexus
    inputs:
      - repository: novus-nexus
      - rules: .nadf/projects/novus-intelligence/rules/lovable-rules.md
      - memory: .nadf/projects/novus-intelligence/memory/
    outputs:
      - artifacts/cambios-lovable.json
      - artifacts/frontend-impact.md
      - artifacts/backend-impact.md
      - artifacts/riesgos.md

  - id: paso-04-generar-plan
    order: 4
    phase: planning
    agent: planner-agent
    action: Planner Agent genera plan de implementación
    inputs:
      - artifacts/cambios-lovable.json
      - artifacts/frontend-impact.md
      - artifacts/backend-impact.md
    outputs:
      - artifacts/plan-implementacion.md
      - artifacts/tareas-ejecutor.json

  - id: paso-05-evaluar-backend-impacto
    order: 5
    phase: planning
    agent: backend-impact-agent
    action: Backend Impact Agent evalúa necesidad backend/DB/infra antes de Plan Review
    inputs:
      - artifacts/backend-impact.md
      - artifacts/cambios-lovable.json
      - rules: .nadf/projects/novus-intelligence/rules/backend-impact-rules.md
    outputs:
      - artifacts/evaluacion-backend.md
      - artifacts/especificacion-backend.md

  - id: paso-06-revisar-plan
    order: 6
    phase: plan_review
    agent: architect-agent
    action: Architect Agent valida impacto arquitectónico con evaluación backend previa
    inputs:
      - artifacts/plan-implementacion.md
      - artifacts/evaluacion-backend.md
      - artifacts/especificacion-backend.md
    outputs:
      - artifacts/impacto-arquitectonico.md

  - id: paso-07-implementar-frontend
    order: 7
    phase: execution
    agent: frontend-integration-agent
    action: Frontend Integration Agent implementa en NovusIntelligenceWEB
    conditions:
      - plan-implementacion.md:status == approved
      - clasificacion:has_frontend_changes == true
    inputs:
      - artifacts/plan-implementacion.md
      - artifacts/frontend-impact.md
      - rules: .nadf/projects/novus-intelligence/rules/frontend-rules.md
    outputs:
      - NovusIntelligenceWEB/**
      - artifacts/resumen-frontend.md

  - id: paso-08-implementar-backend
    order: 8
    phase: execution
    agent: backend-agent
    action: Backend Agent implementa en NovusIntelligenceBack si backend requerido
    conditions:
      - evaluacion-backend.md:requires_backend == true
      - plan-implementacion.md:status == approved
    inputs:
      - artifacts/especificacion-backend.md
    outputs:
      - NovusIntelligenceBack/**
      - artifacts/resumen-backend.md

  - id: paso-09-diseno-database
    order: 9
    phase: execution
    agent: database-agent
    action: Database Agent diseña cambios si DB requerida
    conditions:
      - evaluacion-backend.md:requires_database == true
    outputs:
      - artifacts/especificacion-database.md
      - artifacts/resumen-database.md

  - id: paso-10-propuesta-infra
    order: 10
    phase: execution
    agent: cloud-agent
    action: Cloud Agent genera IaC o propuesta cloud si infra requerida
    conditions:
      - evaluacion-backend.md:requires_infra == true
    outputs:
      - artifacts/propuesta-infra.md
      - artifacts/resumen-cloud.md

  - id: paso-11-validar-qa
    order: 11
    phase: validation
    agent: qa-agent
    action: QA Agent valida calidad
    inputs:
      - project-context.yml
      - rules: .nadf/projects/novus-intelligence/rules/qa-rules.md
    outputs:
      - artifacts/informe-qa.md
      - artifacts/qa-result.json

  - id: paso-12-paridad-visual
    order: 12
    phase: validation
    agent: visual-parity-agent
    action: Comparar Lovable vs productivo; bloquear si no hay paridad exacta
    inputs:
      - artifacts/cambios-lovable.json
      - artifacts/resumen-frontend.md
      - rules/visual-parity-rules.md
      - env:NADF_LOVABLE_REFERENCE_URL
      - env:NADF_DEV_FRONTEND_URL
    outputs:
      - artifacts/visual-parity-result.json
      - artifacts/informe-paridad-visual.md
      - artifacts/gaps-paridad.json
    on_fail: remediate_frontend_then_recheck

  - id: paso-13-revision-seguridad
    order: 13
    phase: validation
    agent: security-agent
    action: Security Agent revisa seguridad
    outputs:
      - artifacts/informe-seguridad.md
      - artifacts/security-result.json

  - id: paso-14-revision-coherencia
    order: 14
    phase: validation
    agent: reviewer-agent
    action: Reviewer Agent verifica coherencia con plan, convenciones y diff review
    inputs:
      - artifacts/plan-implementacion.md
      - artifacts/informe-qa.md
      - artifacts/informe-seguridad.md
      - artifacts/visual-parity-result.json
    outputs:
      - artifacts/informe-revision.md
      - artifacts/checklist-cursor-review.md

  - id: paso-15-documentar
    order: 15
    phase: documentation
    agent: documentation-agent
    action: Documentation Agent documenta ejecución
    inputs:
      - artifacts/**
    outputs:
      - artifacts/resumen-ejecucion.md
      - memory/decision-log.md

  - id: paso-16-metricas
    order: 16
    phase: metrics
    agent: metrics-agent
    action: Metrics Agent registra métricas
    outputs:
      - artifacts/metricas-ejecucion.json
      - artifacts/resumen-metricas.md

  - id: paso-17-reflexion
    order: 17
    phase: reflection
    agent: reflection-agent
    action: Reflection Agent genera aprendizaje
    outputs:
      - artifacts/reflexion-ejecucion.md
      - artifacts/recomendaciones-kb.json

  - id: paso-18-actualizar-kb
    order: 18
    phase: knowledge_base_update
    agent: knowledge-base-agent
    action: Knowledge Base Agent actualiza patrones o errores frecuentes
    inputs:
      - artifacts/reflexion-ejecucion.md
    outputs:
      - artifacts/actualizacion-kb.md

  - id: paso-19-registrar-adrs
    order: 19
    phase: knowledge_base_update
    agent: adr-agent
    action: ADR Agent registra decisiones relevantes
    outputs:
      - artifacts/registro-adr.md

mapping:
  landing_page: "/"
  company_profile: "/about"
  services_section: "/services"
  contact_form: "/contact"
  call_to_action: "componente-reutilizable"

quality_gates:
  - no_lovable_code_copy
  - no_mock_data_in_production
  - build_success
  - responsive_validation
  - seo_basic_validation
  - visual_exact_parity
  - security_pass
  - plan_approved

post_validation:
  auto_merge_dev: true
  auto_deploy_dev: true
  auto_deploy_prod: false

metrics:
  enabled: true
  schema: metrics-schema.json
  workflowId: novus-intelligence-lovable-to-web
