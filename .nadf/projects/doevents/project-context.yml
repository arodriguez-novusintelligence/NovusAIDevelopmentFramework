# NADF-GUIDE
# Propósito: Contexto del proyecto DoEvents (Issues WEB → ajuste WEB/Back → DEV).
# Configuración: Labels nadf / area:*; rama de trabajo feature/NovusAIDevelopmentFramework.
project:
  id: doevents
  name: DoEvents
  kind: product
  environment: [dev]
  production_deploy: forbidden

source:
  adapter: github-issue
  repository: arodriguez-novusintelligence/DoEventsWEB
  issues_url: https://github.com/arodriguez-novusintelligence/DoEventsWEB/issues
  required_label: nadf
  approval_label: "nadf:approved"
  # Con label `nadf` se dispara el ciclo; `nadf:approved` también vale.
  never_auto_execute_body: true

targets:
  frontend:
    repo: https://github.com/arodriguez-novusintelligence/DoEventsWEB.git
    branch: feature/NovusAIDevelopmentFramework
    deploy: deploy-devaws
    region: sa-east-1
  backend:
    repo: https://github.com/arodriguez-novusintelligence/DoEventsBack.git
    branch: feature/NovusAIDevelopmentFramework
    deploy: serverless-dev-when-labeled
    region: sa-east-1

scope:
  # Un issue = un cambio acotado; prohibido refactor masivo u otras features.
  isolation: single-issue
  domain_entities: [eventos, lugares, servicios]
  # Si el issue menciona UNA sola entidad, las otras quedan forbidden + gate de paths.
  path_policies:
    eventos:
      allow:
        - "**/EventsPage.*"
        - "**/discoverEvent*"
        - "**/eventsService*"
        - "**/eventsFeed*"
      deny:
        - "**/venue*"
        - "**/Venue*"
        - "**/useNearbyVenues*"
        - "**/FeedVenues*"
        - "**/service*"
        - "**/Service*"
        - "**/useNearbyServices*"
        - "**/FeedServices*"
    lugares:
      allow: ["**/venue*", "**/Venue*", "**/useNearbyVenues*", "**/FeedVenues*"]
      deny: ["**/discoverEvent*", "**/eventsService*", "**/useNearbyServices*"]
    servicios:
      allow: ["**/service*", "**/Service*", "**/useNearbyServices*", "**/FeedServices*"]
      deny: ["**/discoverEvent*", "**/eventsService*", "**/useNearbyVenues*"]
  forbidden:
    - delete_unrelated_features
    - broad_refactors
    - production_deploy
  allowed_labels:
    - nadf
    - "nadf:approved"
    - "area:web"
    - "area:back"
    - "area:full"

automation:
  github_workflow: .github/workflows/nadf-issue-dev.yml
  complexity_routing:
    enabled: true
    policy: enterprise-governance/complexity-routing.yml
    fail_safe: FULL
  default_branch_work: feature/NovusAIDevelopmentFramework
  auto_merge_dev: true
  auto_deploy_dev: true
  production_deploy: false
  notes:
    - Auto-merge solo a feature/NovusAIDevelopmentFramework (rama de trabajo DEV).
    - Deploy automático solo a https://dev.doeventsapp.com (S3/CloudFront DEV).
    - PROD permanece forbidden.
    - Scope: si el issue pide solo eventos|lugares|servicios, el gate validate:doevents-scope bloquea PRs que toquen las otras.
    - UI invariants Descubre: validate:doevents-ui bloquea pérdida de secciones Y de cableado marketplace
      (fetchNearbyVenues/Services, locationBoundFetched, no enrich bloqueante).
    - Smoke post-deploy: scripts/smoke-discover-marketplace.mjs debe PASS o el job falla (no “éxito” vacío).
    - Runtime coding actual: Cursor Cloud (CURSOR_API_KEY). Anthropic/Claude Platform (ANTHROPIC_API_KEY) es solo inferencia hoy; no abre PRs.

runtime:
  entrypoint: prototypes/m6-cloud-agent
  scripts:
    route: route:doevents-issue
    invoke: invoke:doevents-issue
  model_env: NADF_MODEL

governance:
  human_approval_model: enterprise-governance/human-approval-model.yml
  budget_policy: budget-policy.yml
  agent_selection: agent-selection.yml
  complexity_routing: enterprise-governance/complexity-routing.yml
  production_deploy: forbidden

quality_gates:
  - complexity_routed
  - scope_isolation
  - ui_invariants_discover
  - discover_marketplace_smoke
  - build_or_validate
  - deploy_dev_when_configured
  # Éxito ≠ merge. Éxito = gates PASS + smoke marketplace + build.
  # Un issue de “solo eventos” NO puede desplegarse si rompe lugares/servicios.
