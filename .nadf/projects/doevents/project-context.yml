# NADF-GUIDE
# Propósito: Contexto del proyecto DoEvents como EMPRESA CLIENTE del Administrador de IA NADF
#            (portal.novusintelligencesolutions.com): solicitud del funcional → Claude desarrolla en los
#            repos reales de DoEvents → pruebas → informe → aprobación humana → despliegue.
# Configuración: empresa `doevents` en el portal (stack nadf-portal-{stage}); repos reales vía conector
#                GitHub App NADF (cuentas doeventsrepo y DoEventsApp); motor Claude (Cursor retirado).
version: "2.0"

project:
  id: doevents
  name: DoEvents
  kind: product
  company_id: doevents            # empresa en el portal NADF (tabla nadf-portal-{stage}, COMPANY#doevents)
  environment: [dev, qa, prod]
  production_deploy: approval-required

engine:
  provider: anthropic
  runtime: claude-code-headless   # contenedor efímero por ejecución (CodeBuild), ver doc de diseño NADF
  models:
    development: claude-opus-5-5
    analysis_and_reports: claude-opus-5-5   # puede bajarse a claude-sonnet-5-5 si Novus lo decide por costo
  credentials: secrets-manager:sa-east-1:/nadf/platform/claude-api-key   # clave de la plataforma NADF (workspace propio en la Claude Console)
  legacy_cursor: retired          # el flujo Issues → Cursor Cloud Agent queda solo como histórico

source:
  adapter: nadf-portal            # el funcional pide desde el centro de mando
  company_id: doevents
  never_auto_execute_body: true
  legacy:
    adapter: github-issue
    repository: arodriguez-novusintelligence/DoEventsWEB   # copia histórica; no es el repo real
    status: retired

connectors:
  code:
    provider: github
    auth: github-app:nadf          # una instalación por cuenta; DoEvents elige los repos que comparte
    app: nadf-novus-intelligence   # https://github.com/apps/nadf-novus-intelligence (app_id 5698642)
    app_credentials: secrets-manager:sa-east-1:/nadf/platform/github-app
    installations:
      - account: doeventsrepo
        installation_id: 180570135
        repos: [DoEventsWEB, DoEventsBack, DoEventsIA]
      # DoEventsApp/DoEventsFront (app móvil): excluida temporalmente por decisión de DoEvents (2026-11-10).
    status: installed              # verificado 2026-11-10: la app ve y lee los 3 repos
  cloud:
    provider: aws
    account_id: "519010577666"
    auth: assume-role-per-environment   # roles de solo despliegue; PROD solo en la etapa aprobada
    external_id: nadf-doevents
    roles:
      # Solo asumibles por roles nadf-runner-* (ejecutores NADF). Alcance: bucket + distribución de cada entorno.
      web_dev:  arn:aws:iam::519010577666:role/nadf-doevents-web-deploy-dev
      web_qa:   arn:aws:iam::519010577666:role/nadf-doevents-web-deploy-qa
      web_prod: arn:aws:iam::519010577666:role/nadf-doevents-web-deploy-prod   # + cloudtrail:LookupEvents para el preflight
      # Back e IA: se definen cuando se habiliten pedidos sobre esas apps (permisos más amplios).
    status: roles-created          # 2026-11-10; simulado: cada rol solo publica en su bucket. Falta el ejecutor nadf-runner-* (fase 3).

apps:
  - id: doevents-web
    name: DoEvents WEB
    repo: https://github.com/doeventsrepo/DoEventsWEB.git
    default_branch: main
    stack: React + Vite (npm workspaces shared / mfe-auth / shell)
    commands:
      install: npm ci
      lint: npm run lint
      build: npm run build
      unit_tests: por confirmar   # hay *.test.cjs / *.test.ts en packages/shared y shell, sin script `npm test`
    environments:
      dev:  { url: https://dev.doeventsapp.com, region: sa-east-1, bucket: doevents-web-dev, cloudfront: E1AIDTCT83PAW5, build: "build:devaws", deploy: "deploy:devaws" }
      qa:   { url: https://qa.doeventsapp.com, region: us-east-2, bucket: doevents-web-qa, cloudfront: E3UV9NHXADGSAJ, build: "build:qa", deploy: "deploy:qa" }
      prod: { url: https://web.doeventsapp.com, region: us-west-1, bucket: doevents-web-prod, cloudfront: E1L51KSFEY3YGS, build: "build:prod", deploy: "deploy:prod" }
    prod_preflight:
      # Otros despliegan PROD con frecuencia, a veces desde código no publicado: comparar antes de desplegar.
      - compare_prod_bundle_ui_strings_vs_origin_main
      - cloudtrail_last_invalidation_actor
      - abort_if_prod_differs_from_main
    risk: medium

  - id: doevents-back
    name: DoEvents Back
    repo: https://github.com/doeventsrepo/DoEventsBack.git
    default_branch: main
    stack: Node.js Lambdas (30 servicios aws-lambda-*, Serverless por servicio)
    commands:
      install: npm ci (por servicio)
      unit_tests: por confirmar   # pruebas *.test.js / *.test.cjs sueltas por servicio
    environments:
      dev:  { region: por confirmar, api: https://api-dev.doeventsapp.com }
      qa:   { region: us-east-2, api: https://api-qa.doeventsapp.com }
      prod: { region: us-west-1, api: https://api.doeventsapp.com }
    prod_preflight:
      # El código de PROD no coincide con main en login, generateotp y manageusers: un deploy desde main revierte cambios vivos.
      - download_prod_zip_and_diff_vs_branch
      - deploy_single_function_only
      - abort_if_prod_differs_from_main
    risk: high          # pagos (Wompi), sesiones y datos bancarios: requiere revisión de Desarrollador

  - id: doevents-ia
    name: DoEvents IA (asistente)
    repo: https://github.com/doeventsrepo/DoEventsIA.git
    default_branch: main
    stack: Serverless (Node.js) + Anthropic
    commands:
      install: npm ci
    environments:
      qa:   { region: us-east-2, deploy: serverless deploy --config serverless.qa.yml --stage qa --region us-east-2 }
      prod: { region: us-west-1, stack: doevents-agentes-ia-prod, api: https://api.doeventsapp.com/ai }
    feature_flags: DynamoDB AIAgentConfig (configKey=global), scripts/flags.js
    risk: medium

  # App móvil (DoEventsApp/DoEventsFront, rama Develop, Expo): EXCLUIDA TEMPORALMENTE (decisión 2026-11-10).
  # Al reincorporarla: instalar la GitHub App en DoEventsApp; no tiene despliegue a DEV ni pruebas automatizadas.

priorities:
  # La web es la prioridad: los primeros pedidos del piloto apuntan a doevents-web.
  first: doevents-web

approvals:
  required_approvals: 1
  approvers:
    - arodriguez@doeventsapp.com
    - admin.developer.platform@doeventsapp.com
  mfa_required: true
  separation_of_duties: false     # opcional por app; desactivada por defecto (decisión 2026-11-10)
  high_risk_requires_developer_review: [doevents-back]

scope:
  # Un pedido = un cambio acotado; prohibido refactor masivo u otras features.
  isolation: single-request
  domain_entities: [eventos, lugares, servicios]
  # Si el pedido menciona UNA sola entidad, las otras quedan forbidden + gate de paths.
  path_policies:
    eventos:
      allow:
        - "**/EventsPage.*"
        - "**/discoverEvent*"
        - "**/eventsService*"
        - "**/eventsFeed*"
      deny:
        - "**/venue*"
        - "**/Venue*"
        - "**/useNearbyVenues*"
        - "**/FeedVenues*"
        - "**/service*"
        - "**/Service*"
        - "**/useNearbyServices*"
        - "**/FeedServices*"
    lugares:
      allow: ["**/venue*", "**/Venue*", "**/useNearbyVenues*", "**/FeedVenues*"]
      deny: ["**/discoverEvent*", "**/eventsService*", "**/useNearbyServices*"]
    servicios:
      allow: ["**/service*", "**/Service*", "**/useNearbyServices*", "**/FeedServices*"]
      deny: ["**/discoverEvent*", "**/eventsService*", "**/useNearbyVenues*"]
  forbidden:
    - delete_unrelated_features
    - broad_refactors
    - production_deploy_without_approval
    - secrets_in_code_or_logs

automation:
  work_branch_pattern: nadf/req-{requestId}
  pull_request: draft-until-tests-pass
  auto_deploy_dev: true
  auto_deploy_qa: false
  production_deploy: approval-required
  rules_sources:
    # Reglas existentes que se convierten en CLAUDE.md por repo al conectar DoEvents.
    - DoEventsCICD/Reglas
    - DoEventsWEB/ReglasAgente
    - DoEventsWEB/reglasActuacion
  notes:
    - El portal NADF es la entrada; el flujo por Issues + Cursor queda retirado.
    - DEV se despliega solo tras pasar las pruebas; QA y PROD nunca sin aprobación registrada.
    - Scope: si el pedido es solo eventos|lugares|servicios, el gate de paths bloquea cambios en las otras.
    - UI invariants Descubre: no perder secciones ni el cableado marketplace (fetchNearbyVenues/Services).

governance:
  human_approval_model: enterprise-governance/human-approval-model.yml
  budget_policy: budget-policy.yml
  agent_selection: agent-selection.yml
  complexity_routing: enterprise-governance/complexity-routing.yml
  production_deploy: approval-required

quality_gates:
  - complexity_routed
  - scope_isolation
  - ui_invariants_discover
  - lint_build_unit_tests
  - deploy_dev
  - discover_marketplace_smoke
  - e2e_evidence
  - prod_preflight_matches_main
  - human_approval_recorded
  # Éxito = gates PASS + smoke + evidencias + aprobación humana para PROD.

error_reporting:
  taxonomy: doevents
  portal_report: true
  artifact: execution-report.json
  codes:
    - REPO_PUSH_DENIED
    - PR_NOT_CREATED
    - BUILD_ENV_MISMATCH
    - DEPLOY_ROLE_DENIED
    - SMOKE_FAILED
    - GATE_WIRING_FAILED
    - PROD_DIFFERS_FROM_MAIN
    - APPROVAL_MISSING
