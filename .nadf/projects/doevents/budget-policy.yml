# NADF-GUIDE
# Propósito: Presupuesto de DoEvents como empresa cliente del Administrador de IA NADF.
# Configuración: Ajustar límites con evidencia; PROD solo con aprobación registrada (sin costo de agente de código).
version: "2.0"
extends: ../../../enterprise-governance/budget-policy.yml
project: doevents
environment: [dev, qa, prod]
kill_switch: false
block_new_work_above_usd: 50
notes:
  - Perfiles TRIVIAL/LIGHTWEIGHT deben consumir mucho menos que FULL.
  - Sin cobro al cliente por ahora; el consumo de Claude se mide solo para control interno.
