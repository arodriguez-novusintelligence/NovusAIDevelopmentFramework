# NADF-GUIDE
# Propósito: Define requirement como configuración declarativa NADF.
# Configuración: Cambiar solo con versionado, fixtures, compatibilidad y validator actualizados.
entity: Requirement
mutable_until: APPROVED
states:
  - RECEIVED
  - CLASSIFYING
  - NEEDS_CLARIFICATION
  - AWAITING_APPROVAL
  - APPROVED
  - REJECTED
  - CONVERTED_TO_INTENT
  - IN_EXECUTION
  - VALIDATING
  - COMPLETED
  - BLOCKED
  - CANCELLED
transitions:
  - [RECEIVED, CLASSIFYING]
  - [CLASSIFYING, NEEDS_CLARIFICATION]
  - [CLASSIFYING, AWAITING_APPROVAL]
  - [NEEDS_CLARIFICATION, AWAITING_APPROVAL]
  - [NEEDS_CLARIFICATION, CANCELLED]
  - [AWAITING_APPROVAL, APPROVED]
  - [AWAITING_APPROVAL, REJECTED]
  - [APPROVED, CONVERTED_TO_INTENT]
  - [CONVERTED_TO_INTENT, IN_EXECUTION]
  - [IN_EXECUTION, VALIDATING]
  - [VALIDATING, COMPLETED]
  - [IN_EXECUTION, BLOCKED]
  - [BLOCKED, IN_EXECUTION]
  - [AWAITING_APPROVAL, CANCELLED]
terminal: [REJECTED, COMPLETED, CANCELLED]
