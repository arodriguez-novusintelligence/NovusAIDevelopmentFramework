# RawRequirementEvent — immutable after RECEIVED persistence
entity: RawRequirementEvent
immutable_after: ACCEPTED
states:
  - RECEIVED
  - AUTHENTICATING
  - VALIDATING
  - REJECTED
  - NORMALIZING
  - DUPLICATE
  - ACCEPTED
  - FAILED
  - QUARANTINED
transitions:
  - [RECEIVED, AUTHENTICATING]
  - [AUTHENTICATING, VALIDATING]
  - [AUTHENTICATING, REJECTED]
  - [VALIDATING, NORMALIZING]
  - [VALIDATING, REJECTED]
  - [VALIDATING, QUARANTINED]
  - [NORMALIZING, ACCEPTED]
  - [NORMALIZING, DUPLICATE]
  - [NORMALIZING, FAILED]
  - [VALIDATING, FAILED]
terminal: [REJECTED, DUPLICATE, ACCEPTED, FAILED, QUARANTINED]
