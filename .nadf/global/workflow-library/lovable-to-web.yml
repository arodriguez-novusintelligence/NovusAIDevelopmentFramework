# NADF-GUIDE
# Propósito: Define Sincroniza cambios de Lovable al stack productivo con modelo multiagente de 9 fases como configuración declarativa NADF.
# Configuración: Ajustar triggers, pasos, dependencias, gates y outputs usando referencias del proyecto.
id: lovable-to-web
name: Lovable to Web Sync
version: "2.0.0"
description: Sincroniza cambios de Lovable al stack productivo con modelo multiagente de 9 fases
project: "*"
triggers:
  - manual
  - command:novus-lovable-sync
  - event:lovable.commit

model:
  phases:
    - event_trigger
    - planning
    - plan_review
    - execution
    - validation
    - documentation
    - metrics
    - reflection
    - knowledge_base_update

agents:
  - workflow-agent
  - lovable-analyzer-agent
  - planner-agent
  - architect-agent
  - frontend-integration-agent
  - backend-impact-agent
  - backend-agent
  - database-agent
  - cloud-agent
  - qa-agent
  - security-agent
  - reviewer-agent
  - documentation-agent
  - metrics-agent
  - reflection-agent
  - knowledge-base-agent
  - adr-agent

steps:
  - id: event-trigger
    phase: event_trigger
    agent: workflow-agent
    action: Clasificar evento y preparar plan-workflow
    outputs:
      - artifacts/evento-clasificado.json
      - artifacts/plan-workflow.md

  - id: cargar-contexto
    phase: event_trigger
    agent: null
    action: Leer project-context.yml, reglas y memoria
    outputs:
      - contexto-cargado

  - id: analizar-lovable
    phase: planning
    agent: lovable-analyzer-agent
    action: Analizar cambios Lovable y generar artefactos de impacto
    outputs:
      - artifacts/cambios-lovable.json
      - artifacts/frontend-impact.md
      - artifacts/backend-impact.md
      - artifacts/riesgos.md

  - id: generar-plan
    phase: planning
    agent: planner-agent
    action: Generar plan de implementación
    inputs:
      - artifacts/cambios-lovable.json
      - artifacts/frontend-impact.md
      - artifacts/backend-impact.md
    outputs:
      - artifacts/plan-implementacion.md
      - artifacts/tareas-ejecutor.json

  - id: evaluar-backend-impacto
    phase: planning
    agent: backend-impact-agent
    action: Evaluar necesidad backend/DB/infra
    outputs:
      - artifacts/evaluacion-backend.md
      - artifacts/especificacion-backend.md

  - id: revisar-plan
    phase: plan_review
    agent: architect-agent
    action: Validar impacto arquitectónico y aprobar/rechazar plan
    outputs:
      - artifacts/impacto-arquitectonico.md

  - id: implementar-frontend
    phase: execution
    agent: frontend-integration-agent
    conditions:
      - plan-implementacion.md:status == approved
      - clasificacion:has_frontend_changes == true
    outputs:
      - NovusIntelligenceWEB/**
      - artifacts/resumen-frontend.md

  - id: implementar-backend
    phase: execution
    agent: backend-agent
    conditions:
      - evaluacion-backend.md:requires_backend == true
      - plan-implementacion.md:status == approved
    outputs:
      - NovusIntelligenceBack/**
      - artifacts/resumen-backend.md

  - id: disenar-database
    phase: execution
    agent: database-agent
    conditions:
      - evaluacion-backend.md:requires_database == true
    outputs:
      - artifacts/especificacion-database.md
      - artifacts/resumen-database.md

  - id: proponer-infra
    phase: execution
    agent: cloud-agent
    conditions:
      - evaluacion-backend.md:requires_infra == true
    outputs:
      - artifacts/propuesta-infra.md
      - artifacts/resumen-cloud.md

  - id: ejecutar-qa
    phase: validation
    agent: qa-agent
    outputs:
      - artifacts/informe-qa.md
      - artifacts/qa-result.json

  - id: revision-seguridad
    phase: validation
    agent: security-agent
    outputs:
      - artifacts/informe-seguridad.md
      - artifacts/security-result.json

  - id: revision-coherencia
    phase: validation
    agent: reviewer-agent
    outputs:
      - artifacts/informe-revision.md
      - artifacts/checklist-cursor-review.md

  - id: documentar
    phase: documentation
    agent: documentation-agent
    outputs:
      - artifacts/resumen-ejecucion.md

  - id: registrar-metricas
    phase: metrics
    agent: metrics-agent
    outputs:
      - artifacts/metricas-ejecucion.json
      - artifacts/resumen-metricas.md

  - id: reflexionar
    phase: reflection
    agent: reflection-agent
    outputs:
      - artifacts/reflexion-ejecucion.md
      - artifacts/recomendaciones-kb.json

  - id: actualizar-kb
    phase: knowledge_base_update
    agent: knowledge-base-agent
    outputs:
      - artifacts/actualizacion-kb.md

  - id: registrar-adrs
    phase: knowledge_base_update
    agent: adr-agent
    outputs:
      - artifacts/registro-adr.md

quality_gates:
  - no_lovable_code_copy
  - no_mock_data_in_production
  - build_success
  - responsive_validation
  - seo_basic_validation
  - security_pass
  - plan_approved

metrics:
  enabled: true
  schema: metrics-schema.json
