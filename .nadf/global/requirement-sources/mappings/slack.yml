# NADF-GUIDE
# Propósito: Define slack-default-mapping como configuración declarativa NADF.
# Configuración: Configurar provider, mapping, seguridad y referencias de credenciales; nunca valores.
id: slack-default-mapping
source_definition_id: slack
version: "1.0.0"
field_mappings:
  workspace: team_id
  channel: channel_id
  thread: thread_ts
  user: user_id
  message: text
  attachments: files
  command: command
  reactions: reaction
  timestamp: ts
transformations: []
defaults:
  source_type: slack
validation_rules:
  - title_required
  - description_required
