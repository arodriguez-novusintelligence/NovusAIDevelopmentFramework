# NADF-GUIDE
# Propósito: Define bitbucket-default-mapping como configuración declarativa NADF.
# Configuración: Configurar provider, mapping, seguridad y referencias de credenciales; nunca valores.
id: bitbucket-default-mapping
source_definition_id: bitbucket
version: "1.0.0"
field_mappings:
  repository: repository.full_name
  external_reference: issue.id
  title: issue.title
  description: issue.content.raw
  labels: issue.labels
  assignee: issue.assignee.display_name
transformations: []
defaults:
  source_type: bitbucket
validation_rules:
  - title_required
  - description_required
