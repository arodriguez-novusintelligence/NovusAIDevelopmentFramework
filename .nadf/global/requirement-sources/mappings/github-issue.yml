# NADF-GUIDE
# Propósito: Define github-issue-default-mapping como configuración declarativa NADF.
# Configuración: Configurar provider, mapping, seguridad y referencias de credenciales; nunca valores.
id: github-issue-default-mapping
source_definition_id: github-issue
version: "1.0.0"
field_mappings:
  repository: repository.full_name
  external_reference: issue.number
  title: issue.title
  description: issue.body
  labels: issue.labels
  assignee: issue.assignee.login
  milestone: issue.milestone.title
  branch_reference: issue.pull_request.head.ref
  pull_request_reference: issue.pull_request.url
transformations: []
defaults:
  source_type: github-issue
validation_rules:
  - title_required
  - description_required
