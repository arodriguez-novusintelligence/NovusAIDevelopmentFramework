# NADF-GUIDE
# Propósito: Define database-default-mapping como configuración declarativa NADF.
# Configuración: Configurar provider, mapping, seguridad y referencias de credenciales; nunca valores.
id: database-default-mapping
source_definition_id: database
version: "1.0.0"
field_mappings:
  external_reference: row.id
  title: row.title
  description: row.description
  priority: row.priority
  status: row.status
transformations: []
defaults:
  source_type: database
validation_rules:
  - title_required
  - description_required
