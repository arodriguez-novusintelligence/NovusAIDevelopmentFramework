# NADF-GUIDE
# Propósito: Define email-default-mapping como configuración declarativa NADF.
# Configuración: Configurar provider, mapping, seguridad y referencias de credenciales; nunca valores.
id: email-default-mapping
source_definition_id: email
version: "1.0.0"
field_mappings:
  external_reference: message_id
  requester: from
  recipients: to
  title: subject
  description: text_body
  html_reference: sanitized_html_ref
  attachments: attachments
  thread_id: thread_id
transformations: []
defaults:
  source_type: email
validation_rules:
  - title_required
  - description_required
