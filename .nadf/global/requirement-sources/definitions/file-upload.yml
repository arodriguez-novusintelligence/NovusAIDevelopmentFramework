id: file-upload
name: File Upload
type: file
provider: nadf
version: "1.0.0"
status: active
description: Requirement source definition for File Upload (see ADR-0007)
supported_events:
  - file_uploaded
ingestion_modes:
  - FILE_UPLOAD
authentication_modes:
  - session_or_signed_url
capabilities:
  - type_allowlist
  - size_limit
  - virus_scan_hook
allowed_file_types:
  - md
  - txt
  - json
  - yaml
  - yml
  - csv
  - pdf
configuration_schema:
  required:
    - definition_id
    - project_id
    - enabled
    - ingestion_mode
  credential_required: false
payload_schema:
  versioned: true
  must_include:
    - external_id_or_generated
    - event_type
initial_mapping:
  title: metadata.title
  description: extracted_text_or_ref
  attachments: file
  external_reference: file_id
limitations:
  - "No macro or script execution; PDF as documentary reference only"
risks:
  - "Malicious files"
mcp_server_recommended: null
fallback_api: "filesystem upload gateway"
security:
  signature_validation: required_when_supported
  idempotent: true
  never_auto_execute: true
  secrets: credential_reference_only
