# RequirementSourceConnector — Contrato normativo

**Versión:** 1.0.0  
**Autoridad:** ADR-0007  
**Representaciones:** YAML (normativa) + interfaz conceptual TypeScript (ilustrativa)

---

## YAML normativo

```yaml
contract:
  id: RequirementSourceConnector
  version: "1.0.0"
  description: >
    Contrato abstracto para todas las fuentes de requerimientos.
    Independent del proveedor y del runtime (MCP o HTTP adapter).

  operations:
    - name: validateConfiguration
      required: true
      input: SourceInstanceConfiguration
      output: ConnectorValidationResult
      description: Valida schema de configuración y presencia de credential_reference cuando aplica.

    - name: testConnection
      required: true
      input: SourceInstanceConfiguration
      output: ConnectionTestResult
      side_effects: none_productive
      artifact: artifacts/source-connection-test.json

    - name: receiveEvent
      required: true
      input: ExternalEventInput
      output: RawRequirementEvent
      guarantees:
        - idempotent
        - never_executes_code
        - never_creates_plan_or_intent

    - name: poll
      required: false
      input: { cursor: string? }
      output: PollResult

    - name: fetchDetails
      required: false
      input: { externalId: string }
      output: ExternalRequirementDetails

    - name: fetchAttachments
      required: false
      input: { externalId: string }
      output: RequirementAttachment[]

    - name: acknowledge
      required: false
      input: { externalId: string }
      output: void

    - name: updateExternalStatus
      required: false
      input: { externalId: string, status: string }
      output: void
      requires_policy: true

    - name: addExternalComment
      required: false
      input: { externalId: string, comment: string }
      output: void
      requires_policy: true

  ingestion_modes:
    - WEBHOOK
    - POLLING
    - MANUAL
    - SCHEDULED
    - API_PUSH
    - DATABASE_CDC
    - FILE_UPLOAD
    - EMAIL_INBOUND

  security_invariants:
    - validate_signature_when_supported
    - replay_protection
    - idempotency_by_provider_external_id_event_type_payload_hash
    - secrets_only_via_CredentialReference
    - agent_must_not_see_raw_credentials
    - sanitize_html_markdown
    - quarantine_untrusted_attachments
    - never_auto_execute_from_content
    - rate_limit_enforced
    - dead_letter_on_poison_payload

  error_model:
    retry: exponential_backoff
    quarantine_status: QUARANTINED
    reject_status: REJECTED
```

