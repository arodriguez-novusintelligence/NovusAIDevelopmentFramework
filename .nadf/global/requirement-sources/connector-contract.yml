## Interfaz conceptual (TypeScript ilustrativo)

```typescript
interface RequirementSourceConnector {
  validateConfiguration(): Promise<ConnectorValidationResult>;
  testConnection(): Promise<ConnectionTestResult>;
  receiveEvent(input: ExternalEventInput): Promise<RawRequirementEvent>;
  poll?(cursor?: string): Promise<PollResult>;
  fetchDetails?(externalId: string): Promise<ExternalRequirementDetails>;
  fetchAttachments?(externalId: string): Promise<RequirementAttachment[]>;
  acknowledge?(externalId: string): Promise<void>;
  updateExternalStatus?(externalId: string, status: string): Promise<void>;
  addExternalComment?(externalId: string, comment: string): Promise<void>;
}
```

> Esta interfaz **no** es acoplamiento de runtime. La representación normativa es el bloque YAML superior.

