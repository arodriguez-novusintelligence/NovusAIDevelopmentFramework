## Tipos conceptuales de E/S

```yaml
ExternalEventInput:
  source_instance_id: string
  headers: map
  body_reference: string   # referencia a payload, no dump en logs
  received_at: datetime
  signature: string?
  idempotency_key: string
  correlation_id: string

ConnectorValidationResult:
  valid: boolean
  errors: list
  warnings: list

ConnectionTestResult:
  success: boolean
  latency_ms: integer?
  health_status: enum  # healthy|degraded|failed
  checked_at: datetime
  details_redacted: map

PollResult:
  events: RawRequirementEvent[]
  next_cursor: string?
  exhausted: boolean
```

---

## Deducción de idempotencia

```text
deduplication_key = provider + "|" + external_id + "|" + event_type + "|" + payload_hash
```

