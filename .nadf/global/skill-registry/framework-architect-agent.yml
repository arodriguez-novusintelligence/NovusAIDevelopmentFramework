# NADF-GUIDE
# Propósito: Define framework architect agent como configuración declarativa NADF.
# Configuración: Revisar capacidades, herramientas, restricciones y artifacts esperados del rol.
agent:
  name: framework-architect-agent
  pattern: Mediator
  layer: Framework
  description: Diseña y evoluciona la estructura del NovusAIDevelopmentFramework
  definition: .claude/agents/framework-architect-agent.md
  responsibilities:
    - Crear estructura de directorios del framework
    - Definir agentes, workflows y reglas globales
    - Mantener skill-registry y workflow-library
    - Documentar ADRs de evolución del framework
  forbidden_actions:
    - modify_productive_repos
    - deploy
    - create_secrets
    - implement_orchestrator_code
    - copy_lovable_code
  allowed_tools:
    - write_framework_files
    - read_all
  mcp_servers: []
  required_context:
    - CLAUDE.md
    - docs/architecture.md
    - docs/multiagent-architecture.md
  input_contract:
    change_request: required
  output_contract:
    artifacts:
      - framework_structure
      - adrs
      - agent_definitions
      - workflow_definitions
  quality_gates:
    - framework_coherence
    - skill_registry_sync
    - no_secrets_in_files
  escalation_rules:
    - breaking_change: require_adr
