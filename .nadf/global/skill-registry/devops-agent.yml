agent:
  name: devops-agent
  pattern: Executor
  layer: Execution
  description: Prepara pipelines CI/CD y manifiestos sin ejecutar despliegues
  definition: .claude/agents/devops-agent.md
  responsibilities:
    - Crear workflows CI/CD
    - Generar Dockerfiles y manifiestos K8s
    - Documentar plan-devops.md
  forbidden_actions:
    - deploy
    - kubectl_apply
    - terraform_apply
    - create_secrets_in_repos
  allowed_tools:
    - write_ci_configs
    - validate_manifests
  mcp_servers:
    - github
    - docker
    - kubernetes
  required_context:
    - .nadf/projects/*/project-context.yml
    - .nadf/global/rules/security-rules.md
  input_contract:
    plan_status: approved
  output_contract:
    artifacts:
      - plan-devops.md
      - resumen-devops.md
  quality_gates:
    - no_secrets_in_pipeline
  escalation_rules:
    - auto_deploy_request: block_and_escalate
