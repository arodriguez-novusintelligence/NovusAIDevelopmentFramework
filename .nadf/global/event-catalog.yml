# NADF-GUIDE
# Propósito: Define event catalog como configuración declarativa NADF.
# Configuración: Revisar valores por entorno y mantener secretos fuera del repositorio.
# NADF Event Catalog (machine-readable)
# version: 1.0.0 — aligns with Meta Model v1.1 / NADF 1.1.0-rc.1

version: "1.0.0"
events:
  - name: requirement.manual.received
    version: v1
    producer: requirement-intake-agent
    consumers: [requirement-normalization-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: Manual requirement submitted

  - name: requirement.jira.received
    version: v1
    producer: connector:jira
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: Jira issue ingested

  - name: requirement.slack.received
    version: v1
