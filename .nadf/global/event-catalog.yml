  - name: requirement.database.received
    version: v1
    producer: connector:database
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: Authorized DB change event

  - name: requirement.schedule.received
    version: v1
    producer: connector:scheduled-event
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: Scheduled template requirement

  - name: requirement.normalized.v1
    version: v1
    producer: requirement-normalization-agent
    consumers: [requirement-deduplication-agent, requirement-classification-agent]
    payloadSchema: schemas/requirement.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Requirement normalized

  - name: requirement.approved.v1
    version: v1
    producer: requirement-approval-agent
    consumers: [requirement-traceability-agent, workflow-agent]
    payloadSchema: schemas/requirement.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Human-approved requirement

  - name: intent.created.v1
    version: v1
    producer: workflow-agent
    consumers: [planner-agent]
    payloadSchema: schemas/intent.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Intent created from approved Requirement or Lovable

  - name: mission.created.v1
    version: v1
    producer: planner-agent
    consumers: [architect-agent]
    payloadSchema: schemas/mission.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Mission alias of Plan created

  - name: execution.started.v1
    version: v1
    producer: orchestrator
    consumers: [metrics-agent]
    payloadSchema: schemas/execution.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Execution started

  - name: execution.completed.v1
    version: v1
    producer: orchestrator
    consumers: [qa-agent, metrics-agent]
    payloadSchema: schemas/execution.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Execution completed

  - name: execution.failed.v1
    version: v1
    producer: orchestrator
    consumers: [reflection-agent, metrics-agent]
    payloadSchema: schemas/execution.schema.json
    correlationRequired: true
    causationRequired: true
    audited: true
    description: Execution failed

  - name: lovable.commit
    version: v1
    producer: design_source
    consumers: [workflow-agent, lovable-analyzer-agent]
    payloadSchema: schemas/event.schema.json
    correlationRequired: false
    causationRequired: false
    audited: true
    description: Legacy design-source trigger (v1.0 compatible)
