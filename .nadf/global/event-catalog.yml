    description: GitLab issue ingested

  - name: requirement.bitbucket.received
    version: v1
    producer: connector:bitbucket
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: Bitbucket issue ingested

  - name: requirement.email.received
    version: v1
    producer: connector:email
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
