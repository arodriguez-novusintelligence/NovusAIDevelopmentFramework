  - name: requirement.file.received
    version: v1
    producer: connector:file-upload
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: File upload intake

  - name: requirement.servicenow.received
    version: v1
    producer: connector:servicenow
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
    description: ServiceNow incident

  - name: requirement.form.received
    version: v1
    producer: connector:enterprise-form
    consumers: [requirement-intake-agent]
    payloadSchema: schemas/raw-requirement-event.schema.json
    correlationRequired: true
    causationRequired: false
    audited: true
